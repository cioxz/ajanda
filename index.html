<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Takvim ve Hızlı Notlar</title>
  <style>
    :root {
      --bg: #e5e7eb;
      --card-bg: #ffffff;
      --card-border: #f3f4f6;
      --element-bg: #f3f4f6;
      --element-hover: #e5e7eb;
      --text: #1f2937;
      --text-muted: #6b7280;
      --accent: #4b5563;
      --accent-highlight: #3b82f6;
      --ios-yellow: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px 15px;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid var(--card-border);
    }

    /* Header Structure */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header-center {
      text-align: center;
    }

    .today-info {
      font-size: 0.8rem;
      color: var(--accent-highlight);
      font-weight: 600;
      letter-spacing: 0.3px;
      margin-bottom: 2px;
      text-transform: capitalize;
    }

    .header h2 {
      font-size: 1.25rem;
      color: var(--text);
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-btn {
      background: var(--element-bg);
      color: var(--text);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .header-btn:hover {
      background: var(--element-hover);
    }

    .header-btn:active {
      transform: scale(0.95);
    }

    /* Calendar Grid */
    .weekdays, .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      text-align: center;
    }

    .weekdays div {
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.8rem;
      padding-bottom: 6px;
    }

    .day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--element-bg);
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }

    .day:hover {
      background: #e5e7eb;
    }

    .day:active {
      transform: scale(0.93);
    }

    .note-dot {
      width: 5px;
      height: 5px;
      background-color: var(--accent-highlight);
      border-radius: 50%;
      position: absolute;
      bottom: 5px;
    }

    .day.current-today {
      background: #ffffff;
      border: 2px solid var(--accent-highlight);
      color: var(--accent-highlight);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
    }

    .day.empty {
      background: transparent;
      cursor: default;
    }

    /* Notes Box & Action Buttons */
    .notes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .notes-header h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.3px;
    }

    .notes-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: var(--element-bg);
      color: var(--text);
      border: 1px solid rgba(0, 0, 0, 0.03);
      padding: 8px 14px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 58px;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: #e5e7eb;
    }

    .action-btn:active {
      transform: scale(0.95);
    }

    .action-btn span {
      font-size: 1rem;
    }

    .note-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 280px;
      overflow-y: auto;
    }

    .note-item {
      background: var(--element-bg);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .note-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .note-item-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .note-item-text {
      font-size: 0.95rem;
      color: var(--text);
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .note-item img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 4px;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--danger);
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .delete-btn:hover {
      opacity: 1;
    }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(17, 24, 39, 0.4);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 24px;
      width: 92%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    /* Apple Style Quick Note Modal (Büyütüldü) */
    .ios-modal-content {
      background: #ffffff;
      color: var(--text);
      width: 95%;
      max-width: 460px;
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 30px rgba(0,0,0,0.15);
    }

    .ios-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .ios-close-btn {
      width: 32px;
      height: 32px;
      background: var(--element-bg);
      border-radius: 50%;
      border: none;
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ios-header-center {
      text-align: center;
    }

    .ios-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text);
    }

    .ios-date-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .ios-save-btn {
      background: var(--accent-highlight);
      color: #ffffff;
      border: none;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Büyütülen Not Alanı */
    .ios-editor-area {
      width: 100%;
      height: 320px;
      border: none;
      outline: none;
      font-size: 1rem;
      color: var(--text);
      resize: none;
      background: transparent;
      padding: 10px 4px;
      line-height: 1.6;
    }

    .ios-toolbar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid var(--element-bg);
      color: var(--text-muted);
    }

    .ios-toolbar-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 10px;
      transition: background 0.2s;
    }

    .ios-toolbar-btn:hover {
      background: var(--element-bg);
      color: var(--text);
    }

    .colors {
      display: flex;
      justify-content: space-around;
      margin: 18px 0;
    }

    .color-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .color-btn:active {
      transform: scale(0.9);
    }

    .input-box {
      width: 100%;
      background: var(--element-bg);
      border: 1px solid transparent;
      border-radius: 12px;
      color: var(--text);
      padding: 12px;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 12px;
    }

    textarea.input-box {
      height: 100px;
      resize: none;
    }

    .save-btn {
      background: var(--accent-highlight);
      color: #ffffff;
      font-weight: 600;
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* Canvas (Çizim Ekranı) */
    canvas {
      background: #ffffff;
      border-radius: 16px;
      touch-action: none;
      cursor: crosshair;
      margin-bottom: 12px;
      border: 1px solid var(--element-bg);
    }

    .draw-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .draw-color {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<div class="app">
  <!-- Calendar Card -->
  <div class="card">
    <div class="header">
      <button class="header-btn" onclick="prevMonth()">◄</button>
      <div class="header-center">
        <div class="today-info" id="todayTitle"></div>
        <h2 id="monthTitle"></h2>
      </div>
      <button class="header-btn" onclick="nextMonth()">►</button>
    </div>

    <div class="weekdays">
      <div>Pz</div><div>Pt</div><div>Sa</div><div>Çr</div><div>Pş</div><div>Cu</div><div>Ct</div>
    </div>

    <div class="days" id="daysContainer"></div>
  </div>

  <!-- Notes Box Card -->
  <div class="card">
    <div class="notes-header">
      <h2>📌 Notlar & Çizimler</h2>
      <div class="notes-actions">
        <button class="action-btn" onclick="openDrawModal()">
          <span>✏️</span> Çiz
        </button>
        <button class="action-btn" onclick="openIosNoteModal()">
          <span>➕</span> Not
        </button>
      </div>
    </div>

    <div class="note-list" id="generalNotesList">
      <!-- Dynamic Notes -->
    </div>
  </div>
</div>

<!-- Apple iOS Style Quick Note Modal (Genişletildi) -->
<div class="modal" id="iosNoteModal">
  <div class="ios-modal-content">
    <div class="ios-header">
      <button class="ios-close-btn" onclick="closeModal('iosNoteModal')">✕</button>
      <div class="ios-header-center">
        <div class="ios-title">Yeni Hızlı Not</div>
        <div class="ios-date-subtitle" id="iosModalTimestamp"></div>
      </div>
      <button class="ios-save-btn" onclick="saveIosNote()">Kaydet</button>
    </div>

    <textarea class="ios-editor-area" id="iosNoteInput" placeholder="Not yazmaya başlayın..."></textarea>

    <!-- Gizli Görsel Yükleme Input'u -->
    <input type="file" id="imageUploader" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">

    <div class="ios-toolbar">
      <button class="ios-toolbar-btn" title="Metin Biçimlendir" onclick="formatText()"><b>Aa</b></button>
      <button class="ios-toolbar-btn" title="Yapılacak Listesi" onclick="insertCheckbox()">☑</button>
      <button class="ios-toolbar-btn" title="Tablo Taslağı Ekle" onclick="insertTable()">▦</button>
      <button class="ios-toolbar-btn" title="Görsel Ekle" onclick="triggerImageUpload()">📎</button>
      <button class="ios-toolbar-btn" title="Çizim Yap" onclick="openDrawFromNote()">✏️</button>
    </div>
  </div>
</div>

<!-- Date-Specific Color & Note Modal -->
<div class="modal" id="colorModal">
  <div class="modal-content">
    <h3 id="modalDate" style="margin-bottom: 12px; font-size: 1.1rem; color: var(--text);">Tarih Seç</h3>
    
    <div class="colors">
      <div class="color-btn" style="background:#f3f4f6" onclick="selectColor('')"></div>
      <div class="color-btn" style="background:#fca5a5" onclick="selectColor('#fca5a5')"></div>
      <div class="color-btn" style="background:#fde047" onclick="selectColor('#fde047')"></div>
      <div class="color-btn" style="background:#93c5fd" onclick="selectColor('#93c5fd')"></div>
      <div class="color-btn" style="background:#d8b4fe" onclick="selectColor('#d8b4fe')"></div>
      <div class="color-btn" style="background:#86efac" onclick="selectColor('#86efac')"></div>
    </div>

    <textarea class="input-box" id="noteInput" placeholder="Bu tarihe özel not ekleyin..."></textarea>
    <button class="save-btn" onclick="saveDayData()">Kaydet</button>
  </div>
</div>

<!-- Draw Modal -->
<div class="modal" id="drawModal">
  <div class="modal-content">
    <h3 style="margin-bottom: 12px; font-size: 1.1rem; color: var(--text);">Karalama / Çizim Yap</h3>
    <div class="draw-tools">
      <div class="draw-color" style="background:#1f2937" onclick="setPenColor('#1f2937')"></div>
      <div class="draw-color" style="background:#ef4444" onclick="setPenColor('#ef4444')"></div>
      <div class="draw-color" style="background:#3b82f6" onclick="setPenColor('#3b82f6')"></div>
      <div class="draw-color" style="background:#22c55e" onclick="setPenColor('#22c55e')"></div>
      <button class="header-btn" style="width: auto; padding: 0 10px; font-size: 0.75rem;" onclick="clearCanvas()">Temizle</button>
    </div>
    <canvas id="paintCanvas" width="320" height="260"></canvas>
    <button class="save-btn" onclick="saveDrawing()">Çizimi Kaydet</button>
    <button class="header-btn" style="width:100%; margin-top:8px; justify-content:center; border-radius: 12px;" onclick="closeModal('drawModal')">İptal</button>
  </div>
</div>

<script>
  let currentDate = new Date();
  const realToday = new Date();
  let selectedDateKey = '';
  let selectedColor = '';
  let attachedImage = null;

  const monthNames = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
  const dayNames = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];

  function updateHeaderTodayInfo() {
    const dayName = dayNames[realToday.getDay()];
    const monthName = monthNames[realToday.getMonth()];
    const dateNum = realToday.getDate();
    document.getElementById('todayTitle').innerText = `Bugün: ${dateNum} ${monthName} ${dayName}`;
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById('monthTitle').innerText = `${monthNames[month]} ${year}`;

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const container = document.getElementById('daysContainer');
    container.innerHTML = '';

    for (let i = 0; i < firstDay; i++) {
      const emptyCell = document.createElement('div');
      emptyCell.classList.add('day', 'empty');
      container.appendChild(emptyCell);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dayCell = document.createElement('div');
      dayCell.classList.add('day');
      dayCell.innerText = day;

      if (day === realToday.getDate() && month === realToday.getMonth() && year === realToday.getFullYear()) {
        dayCell.classList.add('current-today');
      }

      const dateKey = `${year}-${month + 1}-${day}`;
      const savedData = JSON.parse(localStorage.getItem(dateKey) || '{}');
      
      if (savedData.color) dayCell.style.backgroundColor = savedData.color;

      if (savedData.note && savedData.note.trim() !== '') {
        const dot = document.createElement('div');
        dot.classList.add('note-dot');
        dayCell.appendChild(dot);
      }

      dayCell.onclick = () => openModal('colorModal', dateKey, day, savedData);
      container.appendChild(dayCell);
    }
  }

  /* General Notes & iOS Quick Notes Logic */
  function loadGeneralNotes() {
    const notesList = document.getElementById('generalNotesList');
    notesList.innerHTML = '';
    const notes = JSON.parse(localStorage.getItem('user_general_notes') || '[]');

    if (notes.length === 0) {
      notesList.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem; text-align:center; padding:18px 0; font-weight:400;">Henüz not veya çizim yok.<br><b>"+"</b> veya <b>"✏️"</b> butonuna basarak ekleyin!</div>';
      return;
    }

    notes.forEach((note, index) => {
      const item = document.createElement('div');
      item.classList.add('note-item');

      let contentHtml = '';
      if (note.type === 'text') {
        contentHtml = `
          <div class="note-item-header">
            <span class="note-item-date">${note.timestamp || ''}</span>
            <button class="delete-btn" onclick="deleteNote(${index})">✕</button>
          </div>
          <div class="note-item-text">${note.text}</div>
          ${note.image ? `<img src="${note.image}" alt="Eklenti Görsel">` : ''}
        `;
      } else if (note.type === 'draw') {
        contentHtml = `
          <div class="note-item-header">
            <span class="note-item-date">🎨 Çizim Notu</span>
            <button class="delete-btn" onclick="deleteNote(${index})">✕</button>
          </div>
          <img src="${note.image}" alt="Çizim">
        `;
      }

      item.innerHTML = contentHtml;
      notesList.appendChild(item);
    });
  }

  function openIosNoteModal() {
    const now = new Date();
    const dateStr = `${now.getDate()} ${monthNames[now.getMonth()]} ${now.getFullYear()} - ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    
    document.getElementById('iosModalTimestamp').innerText = dateStr;
    document.getElementById('iosNoteInput').value = '';
    attachedImage = null;
    document.getElementById('iosNoteModal').style.display = 'flex';
  }

  function saveIosNote() {
    const text = document.getElementById('iosNoteInput').value;
    const timeStr = document.getElementById('iosModalTimestamp').innerText;

    if (!text.trim() && !attachedImage) return;

    const notes = JSON.parse(localStorage.getItem('user_general_notes') || '[]');
    notes.unshift({ type: 'text', text, image: attachedImage, timestamp: timeStr });
    localStorage.setItem('user_general_notes', JSON.stringify(notes));

    closeModal('iosNoteModal');
    loadGeneralNotes();
  }

  /* Araç Çubuğu Buton Fonksiyonları */
  function formatText() {
    const textarea = document.getElementById('iosNoteInput');
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const selectedText = textarea.value.substring(start, end);

    if (selectedText) {
      textarea.value = textarea.value.substring(0, start) + selectedText.toUpperCase() + textarea.value.substring(end);
    } else {
      const currentVal = textarea.value;
      textarea.value = currentVal ? currentVal + "\n📌 " : "📌 ";
    }
    textarea.focus();
  }

  function insertCheckbox() {
    const textarea = document.getElementById('iosNoteInput');
    const start = textarea.selectionStart;
    const currentVal = textarea.value;
    
    const prefix = currentVal && !currentVal.endsWith('\n') ? '\n[ ] ' : '[ ] ';
    textarea.value = currentVal.substring(0, start) + prefix + currentVal.substring(start);
    textarea.focus();
  }

  function insertTable() {
    const textarea = document.getElementById('iosNoteInput');
    const tableTemplate = "\n| Başlık 1 | Başlık 2 |\n|----------|----------|\n| Veri 1   | Veri 2   |\n";
    textarea.value += tableTemplate;
    textarea.focus();
  }

  function triggerImageUpload() {
    document.getElementById('imageUploader').click();
  }

  function handleImageUpload(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        attachedImage = event.target.result;
        const textarea = document.getElementById('iosNoteInput');
        textarea.value += "\n[📷 Görsel Eklendi]";
      };
      reader.readAsDataURL(file);
    }
  }

  function openDrawFromNote() {
    closeModal('iosNoteModal');
    openDrawModal();
  }

  function deleteNote(index) {
    const notes = JSON.parse(localStorage.getItem('user_general_notes') || '[]');
    notes.splice(index, 1);
    localStorage.setItem('user_general_notes', JSON.stringify(notes));
    loadGeneralNotes();
  }

  /* Canvas / Drawing Logic */
  const canvas = document.getElementById('paintCanvas');
  const ctx = canvas.getContext('2d');
  let painting = false;
  let penColor = '#1f2937';

  function setPenColor(color) { penColor = color; }

  function clearCanvas() {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function openDrawModal() {
    document.getElementById('drawModal').style.display = 'flex';
    clearCanvas();
  }

  function startPosition(e) {
    painting = true;
    draw(e);
  }

  function endPosition() {
    painting = false;
    ctx.beginPath();
  }

  function draw(e) {
    if (!painting) return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.strokeStyle = penColor;

    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  }

  canvas.addEventListener('mousedown', startPosition);
  canvas.addEventListener('mouseup', endPosition);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('touchstart', startPosition);
  canvas.addEventListener('touchend', endPosition);
  canvas.addEventListener('touchmove', draw);

  function saveDrawing() {
    const dataUrl = canvas.toDataURL();
    const notes = JSON.parse(localStorage.getItem('user_general_notes') || '[]');
    notes.unshift({ type: 'draw', image: dataUrl });
    localStorage.setItem('user_general_notes', JSON.stringify(notes));

    closeModal('drawModal');
    loadGeneralNotes();
  }

  /* Date Modal Helpers */
  function openModal(id, dateKey, day, savedData) {
    selectedDateKey = dateKey;
    selectedColor = savedData.color || '';
    document.getElementById('modalDate').innerText = `${day} ${monthNames[currentDate.getMonth()]}`;
    document.getElementById('noteInput').value = savedData.note || '';
    document.getElementById(id).style.display = 'flex';
  }

  function closeModal(id) {
    document.getElementById(id).style.display = 'none';
  }

  function selectColor(color) { selectedColor = color; }

  function saveDayData() {
    const noteText = document.getElementById('noteInput').value;
    if (selectedColor || noteText.trim() !== '') {
      localStorage.setItem(selectedDateKey, JSON.stringify({ color: selectedColor, note: noteText }));
    } else {
      localStorage.removeItem(selectedDateKey);
    }
    closeModal('colorModal');
    renderCalendar();
  }

  function prevMonth() { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); }
  function nextMonth() { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); }

  updateHeaderTodayInfo();
  renderCalendar();
  loadGeneralNotes();
</script>

</body>
</html>
