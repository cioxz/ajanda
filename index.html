<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Renk Ajandası</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 15px;
    }

    .app {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header h2 {
      font-size: 1.2rem;
    }

    .header button {
      background: #334155;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .weekdays, .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .weekdays div {
      font-weight: bold;
      color: #94a3b8;
      font-size: 0.85rem;
      padding-bottom: 8px;
    }

    .day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #334155;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, border 0.1s;
    }

    .day:active {
      transform: scale(0.92);
    }

    .day.empty {
      background: transparent;
      cursor: default;
    }

    /* Renk Paleti Modal Popup */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      width: 85%;
      max-width: 320px;
      text-align: center;
    }

    .colors {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
    }

    .color-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .color-btn.selected {
      border-color: #fff;
    }

    .close-btn {
      background: #475569;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <button onclick="prevMonth()">◄</button>
    <h2 id="monthTitle"></h2>
    <button onclick="nextMonth()">►</button>
  </div>

  <div class="weekdays">
    <div>Pz</div><div>Pt</div><div>Sa</div><div>Çr</div><div>Pş</div><div>Cu</div><div>Ct</div>
  </div>

  <div class="days" id="daysContainer"></div>
</div>

<!-- Renk Seçim Ekranı -->
<div class="modal" id="colorModal">
  <div class="modal-content">
    <h3 id="modalDate">Tarih Seç</h3>
    <div class="colors">
      <div class="color-btn" style="background:#334155" onclick="setDayColor('')"></div> <!-- Temizle -->
      <div class="color-btn" style="background:#ef4444" onclick="setDayColor('#ef4444')"></div> <!-- Kırmızı -->
      <div class="color-btn" style="background:#eab308" onclick="setDayColor('#eab308')"></div> <!-- Sarı -->
      <div class="color-btn" style="background:#3b82f6" onclick="setDayColor('#3b82f6')"></div> <!-- Mavi -->
      <div class="color-btn" style="background:#a855f7" onclick="setDayColor('#a855f7')"></div> <!-- Mor -->
      <div class="color-btn" style="background:#22c55e" onclick="setDayColor('#22c55e')"></div> <!-- Yeşil -->
    </div>
    <button class="close-btn" onclick="closeModal()">Kapat</button>
  </div>
</div>

<script>
  let currentDate = new Date();
  let selectedDateKey = '';

  const monthNames = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById('monthTitle').innerText = `${monthNames[month]} ${year}`;

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const container = document.getElementById('daysContainer');
    container.innerHTML = '';

    // Boş günler
    for (let i = 0; i < firstDay; i++) {
      const emptyCell = document.createElement('div');
      emptyCell.classList.add('day', 'empty');
      container.appendChild(emptyCell);
    }

    // Ayın günleri
    for (let day = 1; day <= daysInMonth; day++) {
      const dayCell = document.createElement('div');
      dayCell.classList.add('day');
      dayCell.innerText = day;

      const dateKey = `${year}-${month + 1}-${day}`;
      
      // Kaydedilmiş rengi çek
      const savedColor = localStorage.getItem(dateKey);
      if (savedColor) {
        dayCell.style.backgroundColor = savedColor;
      }

      dayCell.onclick = () => openModal(dateKey, day);
      container.appendChild(dayCell);
    }
  }

  function openModal(dateKey, day) {
    selectedDateKey = dateKey;
    document.getElementById('modalDate').innerText = `${day} ${monthNames[currentDate.getMonth()]}`;
    document.getElementById('colorModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('colorModal').style.display = 'none';
  }

  function setDayColor(color) {
    if (color) {
      localStorage.setItem(selectedDateKey, color);
    } else {
      localStorage.removeItem(selectedDateKey);
    }
    closeModal();
    renderCalendar();
  }

  function prevMonth() {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  }

  function nextMonth() {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  }

  renderCalendar();
</script>

</body>
</html>
