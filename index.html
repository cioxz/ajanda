<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Takvim ve iOS Hızlı Notlar</title>
  <style>
    :root {
      --bg: #f2efe9;
      --card-bg: #faf8f5;
      --card-border: #e3dec3;
      --element-bg: #e6e2da;
      --text: #2c302e;
      --text-muted: #736f68;
      --accent: #8c7a6b;
      --ios-yellow: #d4a359;
      --danger: #d9534f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 15px;
    }

    .app {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      border: 1px solid #e8e4dc;
    }

    /* Header Structure */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header-center {
      text-align: center;
    }

    .today-info {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 2px;
      text-transform: capitalize;
    }

    .header h2 {
      font-size: 1.2rem;
      color: var(--text);
    }

    .header-btn {
      background: var(--element-bg);
      color: var(--text);
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s;
    }

    .header-btn:active {
      background: #dad5cc;
    }

    /* Calendar Grid */
    .weekdays, .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .weekdays div {
      font-weight: bold;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding-bottom: 8px;
    }

    .day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--element-bg);
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      position: relative;
      transition: transform 0.1s, background 0.2s;
    }

    .day:active {
      transform: scale(0.92);
    }

    .note-dot {
      width: 4px;
      height: 4px;
      background-color: var(--accent);
      border-radius: 50%;
      position: absolute;
      bottom: 4px;
    }

    .day.current-today {
      border: 2px solid var(--accent);
      box-shadow: 0 0 8px rgba(140, 122, 107, 0.3);
    }

    .day.empty {
      background: transparent;
      cursor: default;
    }

    /* Notes Box & Cards */
    .notes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .notes-actions {
      display: flex;
      gap: 8px;
    }

    .note-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 250px;
      overflow-y: auto;
    }

    .note-item {
      background: var(--element-bg);
      border: 1px solid #dad5cc;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    .note-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .note-item-date {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .note-item-text {
      font-size: 0.9rem;
      color: var(--text);
      white-space: pre-wrap;
    }

    .note-item img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 5px;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--danger);
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }

    /* Modals Base */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(44, 48, 46, 0.4);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      border: 1px solid #e8e4dc;
    }

    /* Apple Style Quick Note Modal */
    .ios-modal-content {
      background: #faf8f5;
      color: var(--text);
      width: 92%;
      max-width: 380px;
      border-radius: 24px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
      border: 1px solid #e8e4dc;
    }

    .ios-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .ios-close-btn {
      width: 30px;
      height: 30px;
      background: var(--element-bg);
      border-radius: 50%;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ios-header-center {
      text-align: center;
    }

    .ios-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
    }

    .ios-date-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .ios-save-btn {
      background: var(--ios-yellow);
      color: #ffffff;
      border: none;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .ios-editor-area {
      width: 100%;
      height: 180px;
      border: none;
      outline: none;
      font-size: 1rem;
      color: var(--text);
      resize: none;
      background: transparent;
      padding: 8px 4px;
      line-height: 1.5;
    }

    .ios-toolbar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid #e2ddd5;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .ios-toolbar-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .colors {
      display: flex;
      justify-content: space-around;
      margin: 15px 0;
    }

    .color-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .input-box {
      width: 100%;
      background: var(--element-bg);
      border: 1px solid #dad5cc;
      border-radius: 8px;
      color: var(--text);
      padding: 10px;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 10px;
    }

    textarea.input-box {
      height: 80px;
      resize: none;
    }

    .save-btn {
      background: var(--accent);
      color: #ffffff;
      font-weight: bold;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
      margin-top: 5px;
    }

    /* Canvas (Çizim Ekranı) */
    canvas {
      background: #ffffff;
      border-radius: 12px;
      touch-action: none;
      cursor: crosshair;
      margin-bottom: 10px;
      border: 1px solid #dad5cc;
    }

    .draw-tools {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .draw-color {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #ccc;
    }
  </style>
</head>
<body>

<div class="app">
  <!-- Calendar Card -->
  <div class="card">
    <div class="header">
      <button class="header-btn" onclick="prevMonth()">◄</button>
      <div class="header-center">
        <div class="today-info" id="todayTitle"></div>
        <h2 id="monthTitle"></h2>
      </div>
      <button class="header-btn" onclick="nextMonth()">►</button>
    </div>

    <div class="weekdays">
      <div>Pz</div><div>Pt</div><div>Sa</div><div>Çr</div><div>Pş</div><div>Cu</div><div>Ct</div>
    </div>

    <div class="days" id="daysContainer"></div>
  </div>

  <!-- Notes Box Card -->
  <div class="card">
    <div class="notes-header">
      <h2>📌 Notlar & Çizimler</h2>
      <div class="notes-actions">
        <button class="header-btn" onclick="openDrawModal()">✏️ Çiz</button>
        <button class="header-btn" onclick="openIosNoteModal()">➕ Not</button>
      </div>
    </div>

    <div class="note-list" id="generalNotesList">
      <!-- Dynamic Notes -->
    </div>
  </div>
</div>

<!-- Apple iOS Style Quick Note Modal -->
<div class="modal" id="iosNoteModal">
  <div class="ios-modal-content">
    <div class="ios-header">
      <button class="ios-close-btn" onclick="closeModal('iosNoteModal')">✕</button>
      <div class="ios-header-center">
        <div class="ios-title">Yeni Hızlı Not</div>
        <div class="ios-date-subtitle" id="iosModalTimestamp"></div>
      </div>
      <button class="ios-save-btn" onclick="saveIosNote()">Kaydet</button>
    </div>

    <textarea class="ios-editor-area" id="iosNoteInput" placeholder="Not yazmaya başlayın..."></textarea>

    <div class="ios-toolbar">
      <button class="ios-toolbar-btn"><b>Aa</b></button>
      <button class="ios-toolbar-btn">☑</button>
      <button class="ios-toolbar-btn">▦</button>
      <button class="ios-toolbar-btn">📎</button>
      <button class="ios-toolbar-btn">✏️</button>
    </div>
  </div>
</div>

<!-- Date-Specific Color & Note Modal -->
<div class="modal" id="colorModal">
  <div class="modal-content">
    <h3 id="modalDate">Tarih Seç</h3>
    
    <div class="colors">
      <div class="color-btn" style="background:#e6e2da" onclick="selectColor('')"></div>
      <div class="color-btn" style="background:#f87171" onclick="selectColor('#f87171')"></div>
      <div class="color-btn" style="background:#fbbf24" onclick="selectColor('#fbbf24')"></div>
      <div class="color-btn" style="background:#60a5fa" onclick="selectColor('#60a5fa')"></div>
      <div class="color-btn" style="background:#c084fc" onclick="selectColor('#c084fc')"></div>
      <div class="color-btn" style="background:#4ade80" onclick="selectColor('#4ade80')"></div>
    </div>

    <textarea class="input-box" id="noteInput" placeholder="Bu tarihe özel not ekleyin..."></textarea>
    <button class="save-btn" onclick="saveDayData()">Kaydet</button>
  </div>
</div>

<!-- Draw Modal -->
<div class="modal" id="drawModal">
  <div class="modal-content">
    <h3>Karalama / Çizim Yap</h3>
    <div class="draw-tools">
      <div class="draw-color" style="background:#000000" onclick="setPenColor('#000000')"></div>
      <div class="draw-color" style="background:#ef4444" onclick="setPenColor('#ef4444')"></div>
      <div class="draw-color" style="background:#3b82f6" onclick="setPenColor('#3b82f6')"></div>
      <div class="draw-color" style="background:#22c55e" onclick="setPenColor('#22c55e')"></div>
      <button class="header-btn" onclick="clearCanvas()">Temizle</button>
    </div>
    <canvas id="paintCanvas" width="300" height="250"></canvas>
    <button class="save-btn" onclick="saveDrawing()">Çizimi Kaydet</button>
    <button class="header-btn" style="width:100%; margin-top:8px; justify-content:center;" onclick="closeModal('drawModal')">İptal</button>
  </div>
</div>

<script>
  let currentDate = new Date();
  const realToday = new Date();
  let selectedDateKey = '';
  let selectedColor = '';

  const monthNames = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
  const dayNames = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];

  function updateHeaderTodayInfo() {
    const dayName = dayNames[realToday.getDay()];
    const monthName = monthNames[realToday.getMonth()];
    const dateNum = realToday.getDate();
    document.getElementById('todayTitle').innerText = `Bugün: ${dateNum} ${monthName} ${dayName}`;
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById('monthTitle').innerText = `${monthNames[month]} ${year}`;

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const container = document.getElementById('daysContainer');
    container.innerHTML = '';

    for (let i = 0; i < firstDay; i++) {
      const emptyCell = document.createElement('div');
      emptyCell.classList.add('day', 'empty');
      container.appendChild(emptyCell);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dayCell = document.createElement('div');
      dayCell.classList.add('day');
      dayCell.innerText = day;

      if (day === realToday.getDate() && month === realToday.getMonth() && year === realToday.getFullYear()) {
        dayCell.classList.add('current-today');
      }

      const dateKey = `${year}-${month + 1}-${day}`;
      const savedData = JSON.parse(localStorage.getItem(dateKey) || '{}');
      
      if (savedData.color) dayCell.style.backgroundColor = savedData.color;

      if (savedData.note && savedData.note.trim() !== '') {
        const dot = document.createElement('div');
        dot.classList.add('note-dot');
        dayCell.appendChild(dot);
      }

      dayCell.onclick = () => openModal('colorModal', dateKey, day, savedData);
      container.appendChild(dayCell);
    }
  }

  /* General Notes & iOS Quick Notes Logic */
  function loadGeneralNotes() {
    const notesList = document.getElementById('generalNotesList');
    notesList.innerHTML = '';
    const notes = JSON.parse(localStorage.getItem('user_general_notes') || '[]');

    if (notes.length === 0) {
      notesList.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem; text-align:center; padding:10px;">Henüz not veya çizim yok. "+" veya "✏️" butonuna basarak ekleyin!</div>';
      return;
    }

    notes.forEach((note, index) => {
      const item = document.createElement('div');
      item.classList.add('note-item');

      let contentHtml = '';
      if (note.type === 'text') {
        contentHtml = `
          <div class="note-item-header">
            <span class="note-item-date">${note.timestamp || ''}</span>
            <button class="delete-btn" onclick="deleteNote(${index})">✕</button>
          </div>
          <div class="note-item-text">${note.text}</div>
        `;
      } else if (note.type === 'draw') {
        contentHtml = `
          <div class="note-item-header">
            <span class="note-item-date">🎨 Çizim Notu</span>
            <button class="delete-btn" onclick="deleteNote(${index})">✕</button>
          </div>
          <img src="${note.image}" alt="Çizim">
        `;
      }

      item.innerHTML = contentHtml;
      notesList.appendChild(item);
    });
  }

  function openIosNoteModal() {
    const now = new Date();
    const dateStr = `${now.getDate()} ${monthNames[now.getMonth()]} ${now.getFullYear()} - ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    
    document.getElementById('iosModalTimestamp').innerText = dateStr;
    document.getElementById('iosNoteInput').value = '';
    document.getElementById('iosNoteModal').style.display = 'flex';
  }

  function saveIosNote() {
    const text = document.getElementById('iosNoteInput').value;
    const timeStr = document.getElementById('iosModalTimestamp').innerText;

    if (!text.trim()) return;

    const notes = JSON.parse(localStorage.getItem('user_general_notes') || '[]');
    notes.unshift({ type: 'text', text, timestamp: timeStr });
    localStorage.setItem('user_general_notes', JSON.stringify(notes));

    closeModal('iosNoteModal');
    loadGeneralNotes();
  }

  function deleteNote(index) {
    const notes = JSON.parse(localStorage.getItem('user_general_notes') || '[]');
    notes.splice(index, 1);
    localStorage.setItem('user_general_notes', JSON.stringify(notes));
    loadGeneralNotes();
  }

  /* Canvas / Drawing Logic */
  const canvas = document.getElementById('paintCanvas');
  const ctx = canvas.getContext('2d');
  let painting = false;
  let penColor = '#000000';

  function setPenColor(color) { penColor = color; }

  function clearCanvas() {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function openDrawModal() {
    document.getElementById('drawModal').style.display = 'flex';
    clearCanvas();
  }

  function startPosition(e) {
    painting = true;
    draw(e);
  }

  function endPosition() {
    painting = false;
    ctx.beginPath();
  }

  function draw(e) {
    if (!painting) return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.strokeStyle = penColor;

    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  }

  canvas.addEventListener('mousedown', startPosition);
  canvas.addEventListener('mouseup', endPosition);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('touchstart', startPosition);
  canvas.addEventListener('touchend', endPosition);
  canvas.addEventListener('touchmove', draw);

  function saveDrawing() {
    const dataUrl = canvas.toDataURL();
    const notes = JSON.parse(localStorage.getItem('user_general_notes') || '[]');
    notes.unshift({ type: 'draw', image: dataUrl });
    localStorage.setItem('user_general_notes', JSON.stringify(notes));

    closeModal('drawModal');
    loadGeneralNotes();
  }

  /* Date Modal Helpers */
  function openModal(id, dateKey, day, savedData) {
    selectedDateKey = dateKey;
    selectedColor = savedData.color || '';
    document.getElementById('modalDate').innerText = `${day} ${monthNames[currentDate.getMonth()]}`;
    document.getElementById('noteInput').value = savedData.note || '';
    document.getElementById(id).style.display = 'flex';
  }

  function closeModal(id) {
    document.getElementById(id).style.display = 'none';
  }

  function selectColor(color) { selectedColor = color; }

  function saveDayData() {
    const noteText = document.getElementById('noteInput').value;
    if (selectedColor || noteText.trim() !== '') {
      localStorage.setItem(selectedDateKey, JSON.stringify({ color: selectedColor, note: noteText }));
    } else {
      localStorage.removeItem(selectedDateKey);
    }
    closeModal('colorModal');
    renderCalendar();
  }

  function prevMonth() { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); }
  function nextMonth() { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); }

  updateHeaderTodayInfo();
  renderCalendar();
  loadGeneralNotes();
</script>

</body>
</html>
