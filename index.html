<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Renk, Takvim ve Not Ajandası</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 15px;
    }

    .app {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header-center {
      text-align: center;
    }

    .today-info {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 2px;
      text-transform: capitalize;
    }

    .header h2 {
      font-size: 1.2rem;
    }

    .header button {
      background: #334155;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .weekdays, .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .weekdays div {
      font-weight: bold;
      color: #94a3b8;
      font-size: 0.85rem;
      padding-bottom: 8px;
    }

    .day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #334155;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s;
    }

    .day:active {
      transform: scale(0.92);
    }

    .note-dot {
      width: 4px;
      height: 4px;
      background-color: #fff;
      border-radius: 50%;
      position: absolute;
      bottom: 4px;
    }

    .day.current-today {
      border: 2px solid var(--accent);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    }

    .day.empty {
      background: transparent;
      cursor: default;
    }

    /* General Notes Section */
    .notes-section h3 {
      font-size: 1rem;
      color: var(--accent);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .general-note-input {
      width: 100%;
      height: 140px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      color: #fff;
      padding: 12px;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      line-height: 1.4;
    }

    .general-note-input:focus {
      border-color: var(--accent);
    }

    /* Modal Popup */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      width: 85%;
      max-width: 320px;
      text-align: center;
    }

    .colors {
      display: flex;
      justify-content: space-around;
      margin: 15px 0;
    }

    .color-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .date-note-input {
      width: 100%;
      height: 80px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      padding: 10px;
      font-size: 0.9rem;
      resize: none;
      margin-bottom: 15px;
    }

    .save-btn {
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="app">
  <!-- Calendar Card -->
  <div class="card">
    <div class="header">
      <button onclick="prevMonth()">◄</button>
      <div class="header-center">
        <div class="today-info" id="todayTitle"></div>
        <h2 id="monthTitle"></h2>
      </div>
      <button onclick="nextMonth()">►</button>
    </div>

    <div class="weekdays">
      <div>Pz</div><div>Pt</div><div>Sa</div><div>Çr</div><div>Pş</div><div>Cu</div><div>Ct</div>
    </div>

    <div class="days" id="daysContainer"></div>
  </div>

  <!-- General Notes Card -->
  <div class="card notes-section">
    <h3>📝 Genel Notlar</h3>
    <textarea class="general-note-input" id="generalNotes" placeholder="Buraya genel hatırlatmalarınızı, yapılacaklar listelerinizi yazabilirsiniz..."></textarea>
  </div>
</div>

<!-- Date-Specific Color & Note Modal Popup -->
<div class="modal" id="colorModal">
  <div class="modal-content">
    <h3 id="modalDate">Tarih Seç</h3>
    
    <div class="colors">
      <div class="color-btn" style="background:#334155" onclick="selectColor('')"></div> <!-- Clear -->
      <div class="color-btn" style="background:#ef4444" onclick="selectColor('#ef4444')"></div> <!-- Red -->
      <div class="color-btn" style="background:#eab308" onclick="selectColor('#eab308')"></div> <!-- Yellow -->
      <div class="color-btn" style="background:#3b82f6" onclick="selectColor('#3b82f6')"></div> <!-- Blue -->
      <div class="color-btn" style="background:#a855f7" onclick="selectColor('#a855f7')"></div> <!-- Purple -->
      <div class="color-btn" style="background:#22c55e" onclick="selectColor('#22c55e')"></div> <!-- Green -->
    </div>

    <textarea class="date-note-input" id="noteInput" placeholder="Bu tarihe özel not ekleyin..."></textarea>

    <button class="save-btn" onclick="saveDayData()">Kaydet</button>
  </div>
</div>

<script>
  let currentDate = new Date();
  const realToday = new Date();
  let selectedDateKey = '';
  let selectedColor = '';

  const monthNames = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
  const dayNames = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];

  function updateHeaderTodayInfo() {
    const dayName = dayNames[realToday.getDay()];
    const monthName = monthNames[realToday.getMonth()];
    const dateNum = realToday.getDate();
    document.getElementById('todayTitle').innerText = `Bugün: ${dateNum} ${monthName} ${dayName}`;
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById('monthTitle').innerText = `${monthNames[month]} ${year}`;

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const container = document.getElementById('daysContainer');
    container.innerHTML = '';

    for (let i = 0; i < firstDay; i++) {
      const emptyCell = document.createElement('div');
      emptyCell.classList.add('day', 'empty');
      container.appendChild(emptyCell);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dayCell = document.createElement('div');
      dayCell.classList.add('day');
      dayCell.innerText = day;

      if (day === realToday.getDate() && month === realToday.getMonth() && year === realToday.getFullYear()) {
        dayCell.classList.add('current-today');
      }

      const dateKey = `${year}-${month + 1}-${day}`;
      
      const savedData = JSON.parse(localStorage.getItem(dateKey) || '{}');
      
      if (savedData.color) {
        dayCell.style.backgroundColor = savedData.color;
      }

      if (savedData.note && savedData.note.trim() !== '') {
        const dot = document.createElement('div');
        dot.classList.add('note-dot');
        dayCell.appendChild(dot);
      }

      dayCell.onclick = () => openModal(dateKey, day, savedData);
      container.appendChild(dayCell);
    }
  }

  function openModal(dateKey, day, savedData) {
    selectedDateKey = dateKey;
    selectedColor = savedData.color || '';
    document.getElementById('modalDate').innerText = `${day} ${monthNames[currentDate.getMonth()]}`;
    document.getElementById('noteInput').value = savedData.note || '';
    document.getElementById('colorModal').style.display = 'flex';
  }

  function selectColor(color) {
    selectedColor = color;
  }

  function closeModal() {
    document.getElementById('colorModal').style.display = 'none';
  }

  function saveDayData() {
    const noteText = document.getElementById('noteInput').value;

    if (selectedColor || noteText.trim() !== '') {
      const dataToSave = {
        color: selectedColor,
        note: noteText
      };
      localStorage.setItem(selectedDateKey, JSON.stringify(dataToSave));
    } else {
      localStorage.removeItem(selectedDateKey);
    }

    closeModal();
    renderCalendar();
  }

  function prevMonth() {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  }

  function nextMonth() {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  }

  // Auto-save for General Notes
  const generalNotesInput = document.getElementById('generalNotes');
  generalNotesInput.value = localStorage.getItem('general_notes') || '';
  generalNotesInput.addEventListener('input', () => {
    localStorage.setItem('general_notes', generalNotesInput.value);
  });

  updateHeaderTodayInfo();
  renderCalendar();
</script>

</body>
</html>
